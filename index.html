<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>8人マルチパック・エアホッケー</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; }
    #sidebar { width: 260px; padding: 16px; background: #1e1e24; display: flex; flex-direction: column; align-items: center; z-index: 10; box-sizing: border-box; }
    #qrcode { background: #fff; padding: 8px; border-radius: 8px; margin: 8px 0; }
    canvas { flex: 1; background: #0a0a0f; display: block; }
    .player-badge { width: 100%; padding: 8px; margin: 4px 0; border-radius: 4px; font-weight: bold; color: #000; box-sizing: border-box; }
    .controls { width: 100%; background: #2a2a35; padding: 10px 12px; border-radius: 8px; margin: 6px 0; text-align: center; box-sizing: border-box; }
    .control-label { font-size: 12px; color: #ccc; margin-bottom: 6px; }
    .btn-group { display: flex; justify-content: center; align-items: center; gap: 12px; }
    button { background: #007AFF; color: #fff; border: none; border-radius: 6px; width: 32px; height: 32px; font-size: 18px; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.7; }
    #puck-count { font-size: 18px; font-weight: bold; min-width: 24px; }
    input[type="number"] {
      width: 80px; padding: 6px; font-size: 16px; font-weight: bold; text-align: center;
      background: #14141a; color: #fff; border: 1px solid #555; border-radius: 6px;
    }
    input[type="number"]:focus { outline: none; border-color: #007AFF; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3 style="margin: 0 0 4px 0; font-size: 16px;">スマホで参加</h3>
    <div id="qrcode"></div>
    <p id="status" style="font-size: 11px; color: #aaa; margin: 4px 0;">ID発行中...</p>
    
    <!-- パックの数 -->
    <div class="controls">
      <div class="control-label">パックの数（マルチパック）</div>
      <div class="btn-group">
        <button onclick="changePuckCount(-1)">-</button>
        <span id="puck-count">3</span>
        <button onclick="changePuckCount(1)">+</button>
      </div>
    </div>

    <!-- パックのスピード設定 -->
    <div class="controls">
      <div class="control-label">パック速度（上限 2〜30）</div>
      <input type="number" id="puck-speed-input" value="11" min="2" max="30" step="1" onchange="updateSettings()">
    </div>

    <!-- マレットのスピード設定 -->
    <div class="controls">
      <div class="control-label">マレット速度（倍率 0.2〜4.0）</div>
      <input type="number" id="mallet-speed-input" value="1.0" min="0.2" max="4.0" step="0.1" onchange="updateSettings()">
    </div>

    <div id="player-list" style="width: 100%; overflow-y: auto; flex: 1; margin-top: 6px;"></div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const colors = ['#FF3B30', '#007AFF', '#34C759', '#FFCC00', '#AF52DE', '#FF9500', '#5AC8FA', '#FF2D55'];
    const players = {};
    const pucks = [];
    let targetPuckCount = 3;

    // 速度設定用の変数（入力欄と連動）
    let maxPuckSpeed = 11;
    let minPuckSpeed = 1.8;
    let malletSensitivity = 1.0;

    function updateSettings() {
      const puckInput = parseFloat(document.getElementById('puck-speed-input').value);
      if (!isNaN(puckInput)) {
        maxPuckSpeed = Math.max(2, Math.min(30, puckInput));
        document.getElementById('puck-speed-input').value = maxPuckSpeed;
        // 最低速度も上限に合わせてバランス調整
        minPuckSpeed = Math.max(0.5, maxPuckSpeed * 0.16);
      }

      const malletInput = parseFloat(document.getElementById('mallet-speed-input').value);
      if (!isNaN(malletInput)) {
        malletSensitivity = Math.max(0.2, Math.min(4.0, malletInput));
        document.getElementById('mallet-speed-input').value = malletSensitivity.toFixed(1);
      }
    }

    function resize() {
      canvas.width = window.innerWidth - 260;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // パック生成関数
    function createPuck() {
      const angle = Math.random() * Math.PI * 2;
      const speed = minPuckSpeed + (maxPuckSpeed - minPuckSpeed) * 0.25;
      return {
        x: canvas.width / 2 + (Math.random() - 0.5) * 100,
        y: canvas.height / 2 + (Math.random() - 0.5) * 100,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 16,
        color: '#00ffcc'
      };
    }

    function syncPuckCount() {
      while (pucks.length < targetPuckCount) pucks.push(createPuck());
      while (pucks.length > targetPuckCount) pucks.pop();
      document.getElementById('puck-count').innerText = targetPuckCount;
    }

    function changePuckCount(delta) {
      targetPuckCount = Math.max(1, Math.min(10, targetPuckCount + delta));
      syncPuckCount();
    }
    syncPuckCount();

    // 1. PeerJSの初期化（ホスト）
    const peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('status').innerText = 'ルームID: ' + id;
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      const joinUrl = `${baseUrl}controller.html?host=${id}`;
      
      new QRCode(document.getElementById('qrcode'), {
        text: joinUrl,
        width: 140,
        height: 140
      });
    });

    // 2. スマホからの接続受付
    peer.on('connection', (conn) => {
      const playerIndex = Object.keys(players).length;
      if (playerIndex >= 8) {
        conn.close();
        return;
      }

      const color = colors[playerIndex];
      players[conn.peer] = {
        id: conn.peer,
        conn: conn,
        num: playerIndex + 1,
        color: color,
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        radius: 30
      };
      updatePlayerList();

      conn.on('open', () => {
        conn.send({ type: 'init', color: color, num: playerIndex + 1 });
      });

      conn.on('data', (data) => {
        if (data.type === 'move' && players[conn.peer]) {
          const p = players[conn.peer];
          // 入力欄の「マレット速度（malletSensitivity）」を反映
          const moveX = data.dx * malletSensitivity;
          const moveY = data.dy * malletSensitivity;
          p.x = Math.max(p.radius, Math.min(canvas.width - p.radius, p.x + moveX));
          p.y = Math.max(p.radius, Math.min(canvas.height - p.radius, p.y + moveY));
          p.vx = moveX;
          p.vy = moveY;
        }
      });

      conn.on('close', () => {
        delete players[conn.peer];
        updatePlayerList();
      });
    });

    function updatePlayerList() {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      Object.values(players).forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-badge';
        div.style.background = p.color;
        div.innerText = `Player ${p.num}`;
        list.appendChild(div);
      });
    }

    // 3. 物理演算の更新
    function updatePhysics() {
      const playerList = Object.values(players);

      for (let i = 0; i < pucks.length; i++) {
        const puck = pucks[i];
        puck.x += puck.vx;
        puck.y += puck.vy;

        // 摩擦と入力欄に基づく最高・最低速度の制限
        puck.vx *= 0.994;
        puck.vy *= 0.994;
        const currentSpeed = Math.hypot(puck.vx, puck.vy);
        if (currentSpeed > maxPuckSpeed) {
          puck.vx = (puck.vx / currentSpeed) * maxPuckSpeed;
          puck.vy = (puck.vy / currentSpeed) * maxPuckSpeed;
        } else if (currentSpeed < minPuckSpeed && currentSpeed > 0) {
          puck.vx = (puck.vx / currentSpeed) * minPuckSpeed;
          puck.vy = (puck.vy / currentSpeed) * minPuckSpeed;
        }

        // 壁との反射
        if (puck.x - puck.radius < 0) { puck.x = puck.radius; puck.vx = Math.abs(puck.vx); }
        if (puck.x + puck.radius > canvas.width) { puck.x = canvas.width - puck.radius; puck.vx = -Math.abs(puck.vx); }
        if (puck.y - puck.radius < 0) { puck.y = puck.radius; puck.vy = Math.abs(puck.vy); }
        if (puck.y + puck.radius > canvas.height) { puck.y = canvas.height - puck.radius; puck.vy = -Math.abs(puck.vy); }

        // マレットとの衝突判定（くっつき防止・反発強化版）
        playerList.forEach(p => {
          const dx = puck.x - p.x;
          const dy = puck.y - p.y;
          const dist = Math.hypot(dx, dy);
          const minDist = puck.radius + p.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            puck.x = p.x + nx * (minDist + 1);
            puck.y = p.y + ny * (minDist + 1);

            const dot = puck.vx * nx + puck.vy * ny;
            let refVx = dot < 0 ? puck.vx - 2 * dot * nx : puck.vx;
            let refVy = dot < 0 ? puck.vy - 2 * dot * ny : puck.vy;

            const hitSpeed = Math.hypot(p.vx, p.vy);
            // パックの上限速度に合わせて最低反発力も自動スケーリング
            const minBounce = Math.max(1.2, maxPuckSpeed * 0.22);
            const pushSpeed = Math.max(minBounce, hitSpeed * 0.5);

            puck.vx = refVx * 0.9 + nx * pushSpeed + p.vx * 0.25;
            puck.vy = refVy * 0.9 + ny * pushSpeed + p.vy * 0.25;

            if (p.conn && p.conn.open) {
              p.conn.send({ type: 'hit' });
            }
          }
        });

        // パック同士の衝突判定
        for (let j = i + 1; j < pucks.length; j++) {
          const other = pucks[j];
          const dx = other.x - puck.x;
          const dy = other.y - puck.y;
          const dist = Math.hypot(dx, dy);
          const minDist = puck.radius + other.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) / 2;
            puck.x -= nx * overlap;
            puck.y -= ny * overlap;
            other.x += nx * overlap;
            other.y += ny * overlap;

            const kx = puck.vx - other.vx;
            const ky = puck.vy - other.vy;
            const pVal = 2 * (nx * kx + ny * ky) / 2;
            puck.vx -= pVal * nx;
            puck.vy -= pVal * ny;
            other.vx += pVal * nx;
            other.vy += pVal * ny;
          }
        }
      }

      playerList.forEach(p => {
        p.vx *= 0.2;
        p.vy *= 0.2;
      });
    }

    // 4. 描画ループ
    function loop() {
      updatePhysics();

      ctx.fillStyle = 'rgba(10, 10, 15, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 盤面の外枠ライン
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

      // パックの描画
      pucks.forEach(puck => {
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
        ctx.fillStyle = puck.color;
        ctx.shadowBlur = 18;
        ctx.shadowColor = puck.color;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.radius * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      });

      // プレイヤー（マレット）の描画
      Object.values(players).forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.num, p.x, p.y);
      });

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
