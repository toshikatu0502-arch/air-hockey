<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>最大15人マルチパック・エアホッケー（CPU対戦対応）</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; }
    #sidebar { width: 260px; padding: 12px; background: #1e1e24; display: flex; flex-direction: column; align-items: center; z-index: 10; box-sizing: border-box; }
    #qrcode { background: #fff; padding: 6px; border-radius: 8px; margin: 4px 0; }
    canvas { flex: 1; background: #0a0a0f; display: block; }
    .player-badge { width: 100%; padding: 5px 10px; margin: 2px 0; border-radius: 4px; font-weight: bold; color: #000; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .player-badge.eliminated { opacity: 0.35; text-decoration: line-through; }
    .controls { width: 100%; background: #2a2a35; padding: 7px 10px; border-radius: 8px; margin: 3px 0; text-align: center; box-sizing: border-box; }
    .control-label { font-size: 11px; color: #ccc; margin-bottom: 3px; }
    .btn-group { display: flex; justify-content: center; align-items: center; gap: 12px; }
    button.adj-btn { background: #007AFF; color: #fff; border: none; border-radius: 6px; width: 26px; height: 26px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button.main-btn { width: 100%; padding: 9px; background: #34C759; color: #000; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin: 5px 0; }
    button:active { opacity: 0.75; }
    .count-val { font-size: 15px; font-weight: bold; min-width: 20px; }
    input[type="number"] {
      width: 68px; padding: 4px; font-size: 14px; font-weight: bold; text-align: center;
      background: #14141a; color: #fff; border: 1px solid #555; border-radius: 6px;
    }
    input[type="number"]:focus { outline: none; border-color: #007AFF; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3 style="margin: 0 0 2px 0; font-size: 14px;">スマホで参加（最大15人）</h3>
    <div id="qrcode"></div>
    <p id="status" style="font-size: 10px; color: #aaa; margin: 2px 0;">ID発行中...</p>

    <button id="start-btn" class="main-btn" onclick="startGame()">ゲーム開始 / リセット</button>

    <div style="display: flex; gap: 6px; width: 100%;">
      <div class="controls" style="flex: 1;">
        <div class="control-label">パックの数</div>
        <div class="btn-group">
          <button class="adj-btn" onclick="changePuckCount(-1)">-</button>
          <span id="puck-count" class="count-val">3</span>
          <button class="adj-btn" onclick="changePuckCount(1)">+</button>
        </div>
      </div>
      <div class="controls" style="flex: 1;">
        <div class="control-label">CPUの数</div>
        <div class="btn-group">
          <button class="adj-btn" onclick="changeCpuCount(-1)">-</button>
          <span id="cpu-count" class="count-val">0</span>
          <button class="adj-btn" onclick="changeCpuCount(1)">+</button>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 6px; width: 100%;">
      <div class="controls" style="flex: 1;">
        <div class="control-label">パック速度</div>
        <input type="number" id="puck-speed-input" value="7" min="1" max="30" step="1" oninput="updateSettings()" onchange="updateSettings()">
      </div>
      <div class="controls" style="flex: 1;">
        <div class="control-label">マレット倍率</div>
        <input type="number" id="mallet-speed-input" value="1.0" min="0.2" max="4.0" step="0.1" oninput="updateSettings()" onchange="updateSettings()">
      </div>
    </div>

    <div id="player-list" style="width: 100%; overflow-y: auto; flex: 1; margin-top: 4px;"></div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const colors = [
      '#FF3B30', '#007AFF', '#34C759', '#FFCC00', '#AF52DE',
      '#FF9500', '#5AC8FA', '#FF2D55', '#A2845E', '#00C7BE',
      '#30B0C7', '#32ADE6', '#5856D6', '#FF6482', '#FFD60A'
    ];
    const MAX_PLAYERS = 15;
    const players = {};
    const pucks = [];
    let targetPuckCount = 3;
    let autoCpuAdded = false;

    let basePuckSpeed = 7;
    let maxPuckSpeed = 12;
    let minPuckSpeed = 4.5;
    let malletSensitivity = 1.0;

    let goalRatio = 0.36;
    let goalStart = (1 - goalRatio) / 2;
    let goalEnd = 1 - goalStart;
    const ZONE_DEPTH_RATIO = 0.42;

    const INITIAL_LIFE = 5;
    let gameState = 'waiting';
    let winnerText = '';
    let goalFlash = { timer: 0, color: '#fff' };

    let arena = { cx: 0, cy: 0, R: 0, vertices: [], edges: [], shapeName: '' };

    function setGoalRatio(ratio) {
      goalRatio = ratio;
      goalStart = (1 - goalRatio) / 2;
      goalEnd = 1 - goalStart;
    }

    function getNextAvailableNum() {
      const usedNums = new Set(Object.values(players).map(p => p.num));
      for (let i = 1; i <= MAX_PLAYERS; i++) {
        if (!usedNums.has(i)) return i;
      }
      return -1;
    }

    function addCpuPlayer() {
      if (Object.keys(players).length >= MAX_PLAYERS) return false;
      const num = getNextAvailableNum();
      if (num === -1) return false;

      const id = 'cpu_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      players[id] = {
        id: id,
        conn: null,
        isCpu: true,
        num: num,
        edgeIndex: 0,
        color: colors[num - 1],
        life: INITIAL_LIFE,
        alive: true,
        x: arena.cx,
        y: arena.cy,
        vx: 0,
        vy: 0,
        radius: 26
      };
      return true;
    }

    function removeOneCpuPlayer() {
      const cpus = Object.values(players).filter(p => p.isCpu).sort((a, b) => b.num - a.num);
      if (cpus.length > 0) {
        delete players[cpus[0].id];
        return true;
      }
      return false;
    }

    function changeCpuCount(delta) {
      let changed = false;
      if (delta > 0) {
        changed = addCpuPlayer();
        if (changed) autoCpuAdded = false;
      } else {
        changed = removeOneCpuPlayer();
        if (changed) autoCpuAdded = false;
      }

      if (changed) {
        buildArena(true);
        if (gameState === 'gameover') {
          gameState = 'waiting';
          winnerText = '';
        }
        updatePlayerList();
      }
    }

    function makeEdge(v1, v2, isGoalEdge) {
      const mx = (v1.x + v2.x) / 2;
      const my = (v1.y + v2.y) / 2;
      const dx = v2.x - v1.x;
      const dy = v2.y - v1.y;
      const len = Math.hypot(dx, dy);
      const tx = dx / len;
      const ty = dy / len;
      const nx = -ty;
      const ny = tx;
      const distToCenter = (arena.cx - v1.x) * nx + (arena.cy - v1.y) * ny;
      const maxZoneDepth = distToCenter * ZONE_DEPTH_RATIO;
      return { v1, v2, mx, my, tx, ty, len, nx, ny, isGoalEdge, maxZoneDepth };
    }

    // 4人までは四角形、5人以上は正N角形（五角形〜十五角形）に自動変形
    function buildArena(resetPositions = false) {
      canvas.width = window.innerWidth - 260;
      canvas.height = window.innerHeight;
      arena.cx = canvas.width / 2;
      arena.cy = canvas.height / 2;
      const minDim = Math.min(canvas.width, canvas.height);
      arena.R = minDim * 0.45;

      const playerList = Object.values(players).sort((a, b) => a.num - b.num);
      const count = playerList.length;

      arena.vertices = [];
      arena.edges = [];

      if (count <= 1) {
        // 0〜1人：四角形（練習用）
        setGoalRatio(0.36);
        arena.shapeName = '待機中（四角形コート）';
        const half = minDim * 0.42;
        const v = [
          { x: arena.cx - half, y: arena.cy - half },
          { x: arena.cx + half, y: arena.cy - half },
          { x: arena.cx + half, y: arena.cy + half },
          { x: arena.cx - half, y: arena.cy + half }
        ];
        arena.vertices = v;
        arena.edges = [
          makeEdge(v[2], v[3], count === 1),
          makeEdge(v[0], v[1], false),
          makeEdge(v[1], v[2], false),
          makeEdge(v[3], v[0], false)
        ];
      } else if (count === 2) {
        // 2人：横長の四角形（左右2辺がゴール、上下2辺は壁）
        setGoalRatio(0.38);
        arena.shapeName = '2人対戦：四角形コート';
        const halfW = Math.min(canvas.width * 0.46, minDim * 0.65);
        const halfH = minDim * 0.38;
        const v = [
          { x: arena.cx - halfW, y: arena.cy - halfH },
          { x: arena.cx + halfW, y: arena.cy - halfH },
          { x: arena.cx + halfW, y: arena.cy + halfH },
          { x: arena.cx - halfW, y: arena.cy + halfH }
        ];
        arena.vertices = v;
        arena.edges = [
          makeEdge(v[3], v[0], true),  // P1: 左辺
          makeEdge(v[1], v[2], true),  // P2: 右辺
          makeEdge(v[0], v[1], false), // 上壁
          makeEdge(v[2], v[3], false)  // 下壁
        ];
      } else if (count === 3) {
        // 3人：四角形（4辺のうち3辺がゴール、上辺1つが壁）
        setGoalRatio(0.34);
        arena.shapeName = '3人対戦：四角形コート（3辺ゴール）';
        const halfW = Math.min(canvas.width * 0.45, minDim * 0.56);
        const halfH = minDim * 0.42;
        const v = [
          { x: arena.cx - halfW, y: arena.cy - halfH },
          { x: arena.cx + halfW, y: arena.cy - halfH },
          { x: arena.cx + halfW, y: arena.cy + halfH },
          { x: arena.cx - halfW, y: arena.cy + halfH }
        ];
        arena.vertices = v;
        arena.edges = [
          makeEdge(v[3], v[0], true),  // P1: 左辺
          makeEdge(v[1], v[2], true),  // P2: 右辺
          makeEdge(v[2], v[3], true),  // P3: 下辺
          makeEdge(v[0], v[1], false)  // 上辺（壁）
        ];
      } else if (count === 4) {
        // 4人：四角形（上下左右の4辺すべてがゴール）
        setGoalRatio(0.34);
        arena.shapeName = '4人対戦：四角形コート（4辺ゴール）';
        const halfW = Math.min(canvas.width * 0.45, minDim * 0.56);
        const halfH = minDim * 0.42;
        const v = [
          { x: arena.cx - halfW, y: arena.cy - halfH },
          { x: arena.cx + halfW, y: arena.cy - halfH },
          { x: arena.cx + halfW, y: arena.cy + halfH },
          { x: arena.cx - halfW, y: arena.cy + halfH }
        ];
        arena.vertices = v;
        arena.edges = [
          makeEdge(v[2], v[3], true), // P1: 下辺
          makeEdge(v[0], v[1], true), // P2: 上辺
          makeEdge(v[3], v[0], true), // P3: 左辺
          makeEdge(v[1], v[2], true)  // P4: 右辺
        ];
      } else {
        // 5〜15人：五角形から十五角形まで徐々に角を増やす
        setGoalRatio(count <= 6 ? 0.38 : 0.45);
        arena.shapeName = `${count}人対戦：正${count}角形コート`;
        const n = count;
        const startAngle = Math.PI / 2 - Math.PI / n;
        for (let i = 0; i < n; i++) {
          const angle = startAngle + (i * Math.PI * 2) / n;
          arena.vertices.push({
            x: arena.cx + arena.R * Math.cos(angle),
            y: arena.cy + arena.R * Math.sin(angle)
          });
        }
        for (let i = 0; i < n; i++) {
          arena.edges.push(makeEdge(arena.vertices[i], arena.vertices[(i + 1) % n], true));
        }
      }

      const goalEdges = arena.edges.filter(e => e.isGoalEdge);
      const malletRadius = count >= 10 ? 18 : (count >= 6 ? 22 : 25);

      playerList.forEach((p, idx) => {
        if (goalEdges[idx]) {
          p.edgeIndex = arena.edges.indexOf(goalEdges[idx]);
        }
        p.radius = malletRadius;
        if (gameState === 'waiting' || resetPositions) {
          const edge = arena.edges[p.edgeIndex];
          if (edge) {
            const initOffset = Math.min(malletRadius + 20, edge.maxZoneDepth * 0.5);
            p.x = edge.mx + edge.nx * initOffset;
            p.y = edge.my + edge.ny * initOffset;
            p.vx = 0;
            p.vy = 0;
          }
        }
      });
    }
    window.addEventListener('resize', () => buildArena(false));
    buildArena(true);

    function clampMalletToZone(p, x, y) {
      let nx = x;
      let ny = y;

      for (let i = 0; i < arena.edges.length; i++) {
        const edge = arena.edges[i];
        const distToEdge = (nx - edge.v1.x) * edge.nx + (ny - edge.v1.y) * edge.ny;
        if (distToEdge < p.radius) {
          nx += edge.nx * (p.radius - distToEdge);
          ny += edge.ny * (p.radius - distToEdge);
        }
      }

      const myEdge = arena.edges[p.edgeIndex];
      if (myEdge) {
        const distFromMyGoal = (nx - myEdge.v1.x) * myEdge.nx + (ny - myEdge.v1.y) * myEdge.ny;
        const limitDepth = Math.max(p.radius + 8, myEdge.maxZoneDepth - p.radius);
        if (distFromMyGoal > limitDepth) {
          const excess = distFromMyGoal - limitDepth;
          nx -= myEdge.nx * excess;
          ny -= myEdge.ny * excess;
        }
      }

      return { x: nx, y: ny };
    }

    function updateCpuAI(alivePlayers) {
      alivePlayers.forEach(p => {
        if (!p.isCpu) return;
        const edge = arena.edges[p.edgeIndex];
        if (!edge) return;

        let targetPuck = null;
        let bestScore = Infinity;

        pucks.forEach(puck => {
          const distToGoal = (puck.x - edge.v1.x) * edge.nx + (puck.y - edge.v1.y) * edge.ny;
          const approaching = (puck.vx * edge.nx + puck.vy * edge.ny) < 0;
          const score = approaching ? distToGoal * 0.5 : distToGoal + 300;
          if (score < bestScore) {
            bestScore = score;
            targetPuck = puck;
          }
        });

        let targetAlong = edge.len * 0.5;
        let targetDepth = Math.min(p.radius + 20, edge.maxZoneDepth * 0.45);

        if (targetPuck) {
          const along = (targetPuck.x - edge.v1.x) * edge.tx + (targetPuck.y - edge.v1.y) * edge.ty;
          const minAlong = edge.len * Math.max(0.1, goalStart - 0.04);
          const maxAlong = edge.len * Math.min(0.9, goalEnd + 0.04);
          targetAlong = Math.max(minAlong, Math.min(maxAlong, along));

          const distToGoal = (targetPuck.x - edge.v1.x) * edge.nx + (targetPuck.y - edge.v1.y) * edge.ny;
          if (distToGoal < edge.maxZoneDepth * 1.15) {
            targetDepth = Math.min(edge.maxZoneDepth - p.radius, Math.max(p.radius + 14, distToGoal - 8));
          }
        }

        const goalTargetX = edge.v1.x + edge.tx * targetAlong + edge.nx * targetDepth;
        const goalTargetY = edge.v1.y + edge.ty * targetAlong + edge.ny * targetDepth;

        const dx = goalTargetX - p.x;
        const dy = goalTargetY - p.y;
        const dist = Math.hypot(dx, dy);
        const cpuMaxSpeed = Math.max(3.5, basePuckSpeed * 0.65);

        let moveX = dx;
        let moveY = dy;
        if (dist > cpuMaxSpeed) {
          moveX = (dx / dist) * cpuMaxSpeed;
          moveY = (dy / dist) * cpuMaxSpeed;
        }

        const clamped = clampMalletToZone(p, p.x + moveX, p.y + moveY);
        p.vx = clamped.x - p.x;
        p.vy = clamped.y - p.y;
        p.x = clamped.x;
        p.y = clamped.y;
      });
    }

    function updateSettings() {
      const puckInput = parseFloat(document.getElementById('puck-speed-input').value);
      if (!isNaN(puckInput) && puckInput >= 1) {
        const clampedVal = Math.max(1, Math.min(30, puckInput));
        basePuckSpeed = clampedVal;
        minPuckSpeed = clampedVal * 0.75;
        maxPuckSpeed = clampedVal * 1.8;

        pucks.forEach(puck => {
          const cur = Math.hypot(puck.vx, puck.vy);
          if (cur > 0) {
            puck.vx = (puck.vx / cur) * basePuckSpeed;
            puck.vy = (puck.vy / cur) * basePuckSpeed;
          }
        });
      }

      const malletInput = parseFloat(document.getElementById('mallet-speed-input').value);
      if (!isNaN(malletInput) && malletInput >= 0.2) {
        malletSensitivity = Math.max(0.2, Math.min(4.0, malletInput));
      }
    }

    function createPuck() {
      const angle = Math.random() * Math.PI * 2;
      return {
        x: arena.cx + (Math.random() - 0.5) * 40,
        y: arena.cy + (Math.random() - 0.5) * 40,
        vx: Math.cos(angle) * basePuckSpeed,
        vy: Math.sin(angle) * basePuckSpeed,
        radius: 13,
        color: '#00ffcc'
      };
    }

    function resetPuck(puck) {
      const angle = Math.random() * Math.PI * 2;
      puck.x = arena.cx + (Math.random() - 0.5) * 30;
      puck.y = arena.cy + (Math.random() - 0.5) * 30;
      puck.vx = Math.cos(angle) * basePuckSpeed;
      puck.vy = Math.sin(angle) * basePuckSpeed;
    }

    function syncPuckCount() {
      while (pucks.length < targetPuckCount) pucks.push(createPuck());
      while (pucks.length > targetPuckCount) pucks.pop();
      document.getElementById('puck-count').innerText = targetPuckCount;
    }

    function changePuckCount(delta) {
      targetPuckCount = Math.max(1, Math.min(10, targetPuckCount + delta));
      syncPuckCount();
    }
    syncPuckCount();

    function startGame() {
      const humans = Object.values(players).filter(p => !p.isCpu);
      const cpus = Object.values(players).filter(p => p.isCpu);
      if (humans.length === 1 && cpus.length === 0) {
        addCpuPlayer();
        autoCpuAdded = true;
      }

      const playerList = Object.values(players).sort((a, b) => a.num - b.num);
      if (playerList.length < 2) {
        alert('スマホを接続するか、CPUを追加して2人以上にしてください！');
        return;
      }
      playerList.forEach(p => {
        p.life = INITIAL_LIFE;
        p.alive = true;
      });
      buildArena(true);
      pucks.forEach(resetPuck);
      gameState = 'playing';
      winnerText = '';
      updatePlayerList();
    }

    // PeerJS 初期化
    const peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('status').innerText = 'ID: ' + id;
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      const joinUrl = `${baseUrl}controller.html?host=${id}`;
      new QRCode(document.getElementById('qrcode'), { text: joinUrl, width: 120, height: 120 });
    });

    peer.on('connection', (conn) => {
      if (Object.keys(players).length >= MAX_PLAYERS && autoCpuAdded) {
        removeOneCpuPlayer();
      }
      const num = getNextAvailableNum();
      if (num === -1) { conn.close(); return; }

      const color = colors[num - 1];
      players[conn.peer] = {
        id: conn.peer,
        conn: conn,
        isCpu: false,
        num: num,
        edgeIndex: 0,
        color: color,
        life: INITIAL_LIFE,
        alive: true,
        x: arena.cx,
        y: arena.cy,
        vx: 0,
        vy: 0,
        radius: 25
      };

      const humans = Object.values(players).filter(p => !p.isCpu);
      const cpus = Object.values(players).filter(p => p.isCpu);

      if (humans.length === 1 && cpus.length === 0) {
        addCpuPlayer();
        autoCpuAdded = true;
      } else if (humans.length >= 2 && autoCpuAdded && cpus.length === 1 && gameState !== 'playing') {
        removeOneCpuPlayer();
        autoCpuAdded = false;
      }

      buildArena(true);
      updatePlayerList();

      conn.on('open', () => {
        conn.send({ type: 'init', color: color, num: num });
      });

      conn.on('data', (data) => {
        if (data.type === 'move' && players[conn.peer]) {
          const p = players[conn.peer];
          if (!p.alive) return;

          const moveX = data.dx * malletSensitivity;
          const moveY = data.dy * malletSensitivity;
          const clamped = clampMalletToZone(p, p.x + moveX, p.y + moveY);

          p.vx = clamped.x - p.x;
          p.vy = clamped.y - p.y;
          p.x = clamped.x;
          p.y = clamped.y;
        }
      });

      conn.on('close', () => {
        delete players[conn.peer];
        const remHumans = Object.values(players).filter(p => !p.isCpu);
        const remCpus = Object.values(players).filter(p => p.isCpu);
        if (remHumans.length === 1 && remCpus.length === 0) {
          addCpuPlayer();
          autoCpuAdded = true;
        } else if (remHumans.length === 0 && autoCpuAdded) {
          removeOneCpuPlayer();
          autoCpuAdded = false;
        }
        buildArena(true);
        updatePlayerList();
      });
    });

    function updatePlayerList() {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      const sorted = Object.values(players).sort((a, b) => a.num - b.num);
      const cpuCount = sorted.filter(p => p.isCpu).length;
      document.getElementById('cpu-count').innerText = cpuCount;

      sorted.forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-badge' + (p.alive ? '' : ' eliminated');
        div.style.background = p.color;
        const hearts = p.alive ? '♥'.repeat(p.life) : 'OUT';
        const nameTag = p.isCpu ? `CPU (P${p.num})` : `Player ${p.num}`;
        div.innerHTML = `<span>${nameTag}</span><span>${hearts}</span>`;
        list.appendChild(div);
      });
    }

    function updatePhysics() {
      const playerList = Object.values(players);
      const alivePlayers = playerList.filter(p => p.alive);

      updateCpuAI(alivePlayers);

      const edgeOwner = {};
      alivePlayers.forEach(p => { edgeOwner[p.edgeIndex] = p; });

      for (let i = 0; i < pucks.length; i++) {
        const puck = pucks[i];
        puck.x += puck.vx;
        puck.y += puck.vy;

        const currentSpeed = Math.hypot(puck.vx, puck.vy);
        if (currentSpeed > maxPuckSpeed) {
          puck.vx = (puck.vx / currentSpeed) * maxPuckSpeed;
          puck.vy = (puck.vy / currentSpeed) * maxPuckSpeed;
        } else if (currentSpeed < minPuckSpeed && currentSpeed > 0) {
          puck.vx = (puck.vx / currentSpeed) * minPuckSpeed;
          puck.vy = (puck.vy / currentSpeed) * minPuckSpeed;
        }

        for (let eIdx = 0; eIdx < arena.edges.length; eIdx++) {
          const edge = arena.edges[eIdx];
          const distToEdge = (puck.x - edge.v1.x) * edge.nx + (puck.y - edge.v1.y) * edge.ny;

          if (distToEdge < puck.radius) {
            const owner = edgeOwner[eIdx];
            const along = (puck.x - edge.v1.x) * edge.tx + (puck.y - edge.v1.y) * edge.ty;
            const inGoalMouth = along > edge.len * goalStart && along < edge.len * goalEnd;

            if (gameState === 'playing' && owner && inGoalMouth) {
              if (distToEdge < -puck.radius * 0.3) {
                owner.life = Math.max(0, owner.life - 1);
                goalFlash = { timer: 15, color: owner.color };

                if (owner.conn && owner.conn.open) {
                  owner.conn.send({ type: 'goal' });
                }

                if (owner.life <= 0) {
                  owner.alive = false;
                }
                updatePlayerList();
                resetPuck(puck);

                const remaining = Object.values(players).filter(p => p.alive);
                if (Object.keys(players).length >= 2 && remaining.length <= 1) {
                  gameState = 'gameover';
                  if (remaining.length === 1) {
                    const w = remaining[0];
                    winnerText = w.isCpu ? `WINNER: CPU (P${w.num}) !` : `WINNER: Player ${w.num} !`;
                  } else {
                    winnerText = 'DRAW!';
                  }
                }
                break;
              }
            } else {
              puck.x += edge.nx * (puck.radius - distToEdge);
              puck.y += edge.ny * (puck.radius - distToEdge);

              const dot = puck.vx * edge.nx + puck.vy * edge.ny;
              if (dot < 0) {
                const spd = Math.hypot(puck.vx, puck.vy);
                const normalImpact = spd > 0 ? Math.abs(dot) / spd : 0;
                const restitution = 1.0 - (normalImpact * normalImpact) * 0.15;

                puck.vx = (puck.vx - 2 * dot * edge.nx) * restitution;
                puck.vy = (puck.vy - 2 * dot * edge.ny) * restitution;
              }
            }
          }
        }

        alivePlayers.forEach(p => {
          const dx = puck.x - p.x;
          const dy = puck.y - p.y;
          const dist = Math.hypot(dx, dy);
          const minDist = puck.radius + p.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            puck.x = p.x + nx * (minDist + 1);
            puck.y = p.y + ny * (minDist + 1);

            const dot = puck.vx * nx + puck.vy * ny;
            let refVx = dot < 0 ? puck.vx - 2 * dot * nx : puck.vx;
            let refVy = dot < 0 ? puck.vy - 2 * dot * ny : puck.vy;

            const hitSpeed = Math.hypot(p.vx, p.vy);
            const minBounce = Math.max(1.2, basePuckSpeed * 0.85);
            const pushSpeed = Math.max(minBounce, hitSpeed * 0.5);

            puck.vx = refVx * 0.9 + nx * pushSpeed + p.vx * 0.25;
            puck.vy = refVy * 0.9 + ny * pushSpeed + p.vy * 0.25;

            if (p.conn && p.conn.open) {
              p.conn.send({ type: 'hit' });
            }
          }
        });

        for (let j = i + 1; j < pucks.length; j++) {
          const other = pucks[j];
          const dx = other.x - puck.x;
          const dy = other.y - puck.y;
          const dist = Math.hypot(dx, dy);
          const minDist = puck.radius + other.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) / 2;
            puck.x -= nx * overlap;
            puck.y -= ny * overlap;
            other.x += nx * overlap;
            other.y += ny * overlap;

            const kx = puck.vx - other.vx;
            const ky = puck.vy - other.vy;
            const pVal = 2 * (nx * kx + ny * ky) / 2;
            puck.vx -= pVal * nx;
            puck.vy -= pVal * ny;
            other.vx += pVal * nx;
            other.vy += pVal * ny;
          }
        }
      }

      playerList.forEach(p => {
        if (!p.isCpu) { p.vx *= 0.2; p.vy *= 0.2; }
      });
    }

    function drawDefenseZones(edgeOwner) {
      ctx.save();
      ctx.beginPath();
      arena.vertices.forEach((v, i) => {
        if (i === 0) ctx.moveTo(v.x, v.y);
        else ctx.lineTo(v.x, v.y);
      });
      ctx.closePath();
      ctx.clip();

      for (let i = 0; i < arena.edges.length; i++) {
        const edge = arena.edges[i];
        const owner = edgeOwner[i];
        if (!owner) continue;

        const depth = edge.maxZoneDepth;
        ctx.beginPath();
        ctx.moveTo(edge.v1.x, edge.v1.y);
        ctx.lineTo(edge.v2.x, edge.v2.y);
        ctx.lineTo(edge.v2.x + edge.nx * depth, edge.v2.y + edge.ny * depth);
        ctx.lineTo(edge.v1.x + edge.nx * depth, edge.v1.y + edge.ny * depth);
        ctx.closePath();
        ctx.fillStyle = owner.color;
        ctx.globalAlpha = 0.06;
        ctx.fill();
        ctx.globalAlpha = 1.0;

        ctx.beginPath();
        ctx.moveTo(edge.v1.x + edge.nx * depth - edge.tx * 200, edge.v1.y + edge.ny * depth - edge.ty * 200);
        ctx.lineTo(edge.v2.x + edge.nx * depth + edge.tx * 200, edge.v2.y + edge.ny * depth + edge.ty * 200);
        ctx.strokeStyle = owner.color;
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1.0;
      }

      ctx.restore();
    }

    function loop() {
      updatePhysics();

      ctx.fillStyle = 'rgba(10, 10, 15, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (goalFlash.timer > 0) {
        ctx.fillStyle = goalFlash.color;
        ctx.globalAlpha = (goalFlash.timer / 15) * 0.25;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
        goalFlash.timer--;
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(arena.shapeName, 16, 26);

      const edgeOwner = {};
      Object.values(players).filter(p => p.alive).forEach(p => { edgeOwner[p.edgeIndex] = p; });

      drawDefenseZones(edgeOwner);

      ctx.beginPath();
      ctx.arc(arena.cx, arena.cy, Math.min(canvas.width, canvas.height) * 0.07, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 2;
      ctx.stroke();

      for (let i = 0; i < arena.edges.length; i++) {
        const edge = arena.edges[i];
        const owner = edgeOwner[i];

        if (owner) {
          const g1x = edge.v1.x + edge.tx * (edge.len * goalStart);
          const g1y = edge.v1.y + edge.ty * (edge.len * goalStart);
          const g2x = edge.v1.x + edge.tx * (edge.len * goalEnd);
          const g2y = edge.v1.y + edge.ty * (edge.len * goalEnd);

          ctx.beginPath();
          ctx.moveTo(g1x, g1y);
          ctx.lineTo(g2x, g2y);
          ctx.strokeStyle = owner.color;
          ctx.lineWidth = 6;
          ctx.setLineDash([8, 6]);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.beginPath();
          ctx.moveTo(edge.v1.x, edge.v1.y);
          ctx.lineTo(g1x, g1y);
          ctx.moveTo(g2x, g2y);
          ctx.lineTo(edge.v2.x, edge.v2.y);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 6;
          ctx.stroke();

          const labelX = edge.mx - edge.nx * 26;
          const labelY = edge.my - edge.ny * 26;
          ctx.fillStyle = owner.color;
          ctx.font = Object.keys(players).length >= 10 ? 'bold 12px sans-serif' : 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const tag = owner.isCpu ? `CPU(${owner.life})` : `P${owner.num}(${owner.life})`;
          ctx.fillText(tag, labelX, labelY);
        } else {
          ctx.beginPath();
          ctx.moveTo(edge.v1.x, edge.v1.y);
          ctx.lineTo(edge.v2.x, edge.v2.y);
          ctx.strokeStyle = '#444';
          ctx.lineWidth = 6;
          ctx.stroke();
        }
      }

      pucks.forEach(puck => {
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
        ctx.fillStyle = puck.color;
        ctx.shadowBlur = 14;
        ctx.shadowColor = puck.color;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.radius * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      });

      Object.values(players).filter(p => p.alive).forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.font = p.radius < 20 ? 'bold 11px sans-serif' : 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.isCpu ? 'CPU' : p.num, p.x, p.y);
      });

      if (gameState === 'waiting') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('参加者が揃ったら「ゲーム開始」を押してください', arena.cx, arena.cy);
      } else if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(arena.cx - 210, arena.cy - 45, 420, 90);
        ctx.fillStyle = '#FFCC00';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(winnerText, arena.cx, arena.cy);
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
