<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>8人マルチパック・エアホッケー</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; }
    #sidebar { width: 260px; padding: 14px; background: #1e1e24; display: flex; flex-direction: column; align-items: center; z-index: 10; box-sizing: border-box; }
    #qrcode { background: #fff; padding: 6px; border-radius: 8px; margin: 6px 0; }
    canvas { flex: 1; background: #0a0a0f; display: block; }
    .player-badge { width: 100%; padding: 6px 10px; margin: 3px 0; border-radius: 4px; font-weight: bold; color: #000; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .player-badge.eliminated { opacity: 0.35; text-decoration: line-through; }
    .controls { width: 100%; background: #2a2a35; padding: 8px 10px; border-radius: 8px; margin: 4px 0; text-align: center; box-sizing: border-box; }
    .control-label { font-size: 11px; color: #ccc; margin-bottom: 4px; }
    .btn-group { display: flex; justify-content: center; align-items: center; gap: 12px; }
    button.adj-btn { background: #007AFF; color: #fff; border: none; border-radius: 6px; width: 28px; height: 28px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button.main-btn { width: 100%; padding: 10px; background: #34C759; color: #000; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin: 6px 0; }
    button:active { opacity: 0.75; }
    #puck-count { font-size: 16px; font-weight: bold; min-width: 20px; }
    input[type="number"] {
      width: 70px; padding: 4px; font-size: 14px; font-weight: bold; text-align: center;
      background: #14141a; color: #fff; border: 1px solid #555; border-radius: 6px;
    }
    input[type="number"]:focus { outline: none; border-color: #007AFF; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3 style="margin: 0 0 2px 0; font-size: 15px;">スマホで参加</h3>
    <div id="qrcode"></div>
    <p id="status" style="font-size: 10px; color: #aaa; margin: 2px 0;">ID発行中...</p>

    <button id="start-btn" class="main-btn" onclick="startGame()">ゲーム開始 / リセット</button>

    <div class="controls">
      <div class="control-label">パックの数（マルチパック）</div>
      <div class="btn-group">
        <button class="adj-btn" onclick="changePuckCount(-1)">-</button>
        <span id="puck-count">3</span>
        <button class="adj-btn" onclick="changePuckCount(1)">+</button>
      </div>
    </div>

    <div style="display: flex; gap: 6px; width: 100%;">
      <div class="controls" style="flex: 1;">
        <div class="control-label">パック上限</div>
        <input type="number" id="puck-speed-input" value="11" min="2" max="30" step="1" onchange="updateSettings()">
      </div>
      <div class="controls" style="flex: 1;">
        <div class="control-label">マレット倍率</div>
        <input type="number" id="mallet-speed-input" value="1.0" min="0.2" max="4.0" step="0.1" onchange="updateSettings()">
      </div>
    </div>

    <div id="player-list" style="width: 100%; overflow-y: auto; flex: 1; margin-top: 4px;"></div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const colors = ['#FF3B30', '#007AFF', '#34C759', '#FFCC00', '#AF52DE', '#FF9500', '#5AC8FA', '#FF2D55'];
    const players = {};
    const pucks = [];
    let targetPuckCount = 3;

    // 速度設定
    let maxPuckSpeed = 11;
    let minPuckSpeed = 1.8;
    let malletSensitivity = 1.0;

    // ゲーム状態管理
    const INITIAL_LIFE = 5;
    let gameState = 'waiting'; // 'waiting' | 'playing' | 'gameover'
    let winnerText = '';
    let goalFlash = { timer: 0, color: '#fff' };

    // 正八角形アリーナパラメータ
    let arena = { cx: 0, cy: 0, R: 0, vertices: [], edges: [] };

    function buildArena() {
      canvas.width = window.innerWidth - 260;
      canvas.height = window.innerHeight;
      arena.cx = canvas.width / 2;
      arena.cy = canvas.height / 2;
      arena.R = Math.min(canvas.width, canvas.height) * 0.45;

      arena.vertices = [];
      // 8角形の各辺が水平・垂直・45度になるよう22.5度ずらして頂点を配置
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI / 4) + (Math.PI / 8);
        arena.vertices.push({
          x: arena.cx + arena.R * Math.cos(angle),
          y: arena.cy + arena.R * Math.sin(angle)
        });
      }

      arena.edges = [];
      for (let i = 0; i < 8; i++) {
        const v1 = arena.vertices[i];
        const v2 = arena.vertices[(i + 1) % 8];
        const mx = (v1.x + v2.x) / 2;
        const my = (v1.y + v2.y) / 2;
        const dx = v2.x - v1.x;
        const dy = v2.y - v1.y;
        const len = Math.hypot(dx, dy);
        // 内側へ向かう法線ベクトル
        const nx = -(arena.cx - mx) !== 0 || -(arena.cy - my) !== 0
          ? (arena.cx - mx) / Math.hypot(arena.cx - mx, arena.cy - my)
          : 0;
        const ny = (arena.cy - my) / Math.hypot(arena.cx - mx, arena.cy - my);

        arena.edges.push({
          index: i,
          v1, v2,
          mx, my,
          tx: dx / len,
          ty: dy / len,
          len,
          nx, ny
        });
      }
    }
    window.addEventListener('resize', buildArena);
    buildArena();

    function updateSettings() {
      const puckInput = parseFloat(document.getElementById('puck-speed-input').value);
      if (!isNaN(puckInput)) {
        maxPuckSpeed = Math.max(2, Math.min(30, puckInput));
        document.getElementById('puck-speed-input').value = maxPuckSpeed;
        minPuckSpeed = Math.max(0.5, maxPuckSpeed * 0.16);
      }
      const malletInput = parseFloat(document.getElementById('mallet-speed-input').value);
      if (!isNaN(malletInput)) {
        malletSensitivity = Math.max(0.2, Math.min(4.0, malletInput));
        document.getElementById('mallet-speed-input').value = malletSensitivity.toFixed(1);
      }
    }

    function createPuck() {
      const angle = Math.random() * Math.PI * 2;
      const speed = minPuckSpeed + (maxPuckSpeed - minPuckSpeed) * 0.25;
      return {
        x: arena.cx + (Math.random() - 0.5) * 60,
        y: arena.cy + (Math.random() - 0.5) * 60,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 15,
        color: '#00ffcc'
      };
    }

    function resetPuck(puck) {
      const angle = Math.random() * Math.PI * 2;
      const speed = minPuckSpeed + (maxPuckSpeed - minPuckSpeed) * 0.25;
      puck.x = arena.cx + (Math.random() - 0.5) * 40;
      puck.y = arena.cy + (Math.random() - 0.5) * 40;
      puck.vx = Math.cos(angle) * speed;
      puck.vy = Math.sin(angle) * speed;
    }

    function syncPuckCount() {
      while (pucks.length < targetPuckCount) pucks.push(createPuck());
      while (pucks.length > targetPuckCount) pucks.pop();
      document.getElementById('puck-count').innerText = targetPuckCount;
    }

    function changePuckCount(delta) {
      targetPuckCount = Math.max(1, Math.min(10, targetPuckCount + delta));
      syncPuckCount();
    }
    syncPuckCount();

    // ゲーム開始・リセット処理
    function startGame() {
      const playerList = Object.values(players);
      if (playerList.length === 0) {
        alert('先にスマホを1台以上接続してください！');
        return;
      }
      playerList.forEach(p => {
        p.life = INITIAL_LIFE;
        p.alive = true;
        // 自分のゴール辺の少し内側に初期配置
        const edge = arena.edges[p.slot];
        p.x = edge.mx + edge.nx * 55;
        p.y = edge.my + edge.ny * 55;
        p.vx = 0;
        p.vy = 0;
      });
      pucks.forEach(resetPuck);
      gameState = 'playing';
      winnerText = '';
      updatePlayerList();
    }

    // PeerJS 初期化
    const peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('status').innerText = 'ID: ' + id;
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      const joinUrl = `${baseUrl}controller.html?host=${id}`;
      new QRCode(document.getElementById('qrcode'), { text: joinUrl, width: 130, height: 130 });
    });

    peer.on('connection', (conn) => {
      // 空いているスロット（0〜7）を探す
      const usedSlots = new Set(Object.values(players).map(p => p.slot));
      let slot = -1;
      for (let i = 0; i < 8; i++) {
        if (!usedSlots.has(i)) { slot = i; break; }
      }
      if (slot === -1) { conn.close(); return; }

      const color = colors[slot];
      const edge = arena.edges[slot];
      players[conn.peer] = {
        id: conn.peer,
        conn: conn,
        slot: slot,
        num: slot + 1,
        color: color,
        life: INITIAL_LIFE,
        alive: true,
        x: edge.mx + edge.nx * 55,
        y: edge.my + edge.ny * 55,
        vx: 0,
        vy: 0,
        radius: 26
      };
      updatePlayerList();

      conn.on('open', () => {
        conn.send({ type: 'init', color: color, num: slot + 1 });
      });

      conn.on('data', (data) => {
        if (data.type === 'move' && players[conn.peer]) {
          const p = players[conn.peer];
          if (!p.alive) return; // 脱落後は操作不可

          const moveX = data.dx * malletSensitivity;
          const moveY = data.dy * malletSensitivity;
          let nextX = p.x + moveX;
          let nextY = p.y + moveY;

          // マレットが八角形の外に出ないよう制限
          const distFromCenter = Math.hypot(nextX - arena.cx, nextY - arena.cy);
          const maxR = arena.R * 0.92 - p.radius;
          if (distFromCenter > maxR) {
            const ang = Math.atan2(nextY - arena.cy, nextX - arena.cx);
            nextX = arena.cx + Math.cos(ang) * maxR;
            nextY = arena.cy + Math.sin(ang) * maxR;
          }

          p.x = nextX;
          p.y = nextY;
          p.vx = moveX;
          p.vy = moveY;
        }
      });

      conn.on('close', () => {
        delete players[conn.peer];
        updatePlayerList();
      });
    });

    function updatePlayerList() {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      Object.values(players).sort((a, b) => a.slot - b.slot).forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-badge' + (p.alive ? '' : ' eliminated');
        div.style.background = p.color;
        const hearts = p.alive ? '♥'.repeat(p.life) : 'OUT';
        div.innerHTML = `<span>P${p.num}</span><span>${hearts}</span>`;
        list.appendChild(div);
      });
    }

    // 物理演算＆ゴール判定
    function updatePhysics() {
      const playerList = Object.values(players);
      const alivePlayers = playerList.filter(p => p.alive);

      // スロット番号 -> 生存プレイヤーのマップ作成
      const slotOwner = {};
      alivePlayers.forEach(p => { slotOwner[p.slot] = p; });

      for (let i = 0; i < pucks.length; i++) {
        const puck = pucks[i];
        puck.x += puck.vx;
        puck.y += puck.vy;

        puck.vx *= 0.994;
        puck.vy *= 0.994;
        const currentSpeed = Math.hypot(puck.vx, puck.vy);
        if (currentSpeed > maxPuckSpeed) {
          puck.vx = (puck.vx / currentSpeed) * maxPuckSpeed;
          puck.vy = (puck.vy / currentSpeed) * maxPuckSpeed;
        } else if (currentSpeed < minPuckSpeed && currentSpeed > 0) {
          puck.vx = (puck.vx / currentSpeed) * minPuckSpeed;
          puck.vy = (puck.vy / currentSpeed) * minPuckSpeed;
        }

        // 正八角形の各辺との衝突・ゴール判定
        for (let eIdx = 0; eIdx < 8; eIdx++) {
          const edge = arena.edges[eIdx];
          // 辺からパック中心までの内側距離（内積）
          const distToEdge = (puck.x - edge.v1.x) * edge.nx + (puck.y - edge.v1.y) * edge.ny;

          if (distToEdge < puck.radius) {
            const owner = slotOwner[eIdx];
            // 辺に沿った位置（0 〜 edge.len）
            const along = (puck.x - edge.v1.x) * edge.tx + (puck.y - edge.v1.y) * edge.ty;
            // ゴール開口幅は辺の中央75%（両端12.5%はポスト壁）
            const inGoalMouth = along > edge.len * 0.125 && along < edge.len * 0.875;

            if (gameState === 'playing' && owner && inGoalMouth) {
              // ゴールラインを完全に割ったら失点処理
              if (distToEdge < -puck.radius * 0.3) {
                owner.life = Math.max(0, owner.life - 1);
                goalFlash = { timer: 15, color: owner.color };

                if (owner.conn && owner.conn.open) {
                  owner.conn.send({ type: 'goal' });
                }

                if (owner.life <= 0) {
                  owner.alive = false;
                }
                updatePlayerList();
                resetPuck(puck);

                // 勝敗チェック（2人以上参加時、残り1人になったら終了）
                const remaining = Object.values(players).filter(p => p.alive);
                if (Object.keys(players).length >= 2 && remaining.length <= 1) {
                  gameState = 'gameover';
                  winnerText = remaining.length === 1
                    ? `WINNER: Player ${remaining[0].num} !`
                    : 'DRAW!';
                }
                break;
              }
            } else {
              // 空き辺・ポスト・待機中は壁として跳ね返す
              puck.x += edge.nx * (puck.radius - distToEdge);
              puck.y += edge.ny * (puck.radius - distToEdge);
              const dot = puck.vx * edge.nx + puck.vy * edge.ny;
              if (dot < 0) {
                puck.vx -= 2 * dot * edge.nx;
                puck.vy -= 2 * dot * edge.ny;
              }
            }
          }
        }

        // マレットとの衝突判定（生存プレイヤーのみ）
        alivePlayers.forEach(p => {
          const dx = puck.x - p.x;
          const dy = puck.y - p.y;
          const dist = Math.hypot(dx, dy);
          const minDist = puck.radius + p.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            puck.x = p.x + nx * (minDist + 1);
            puck.y = p.y + ny * (minDist + 1);

            const dot = puck.vx * nx + puck.vy * ny;
            let refVx = dot < 0 ? puck.vx - 2 * dot * nx : puck.vx;
            let refVy = dot < 0 ? puck.vy - 2 * dot * ny : puck.vy;

            const hitSpeed = Math.hypot(p.vx, p.vy);
            const minBounce = Math.max(1.2, maxPuckSpeed * 0.22);
            const pushSpeed = Math.max(minBounce, hitSpeed * 0.5);

            puck.vx = refVx * 0.9 + nx * pushSpeed + p.vx * 0.25;
            puck.vy = refVy * 0.9 + ny * pushSpeed + p.vy * 0.25;

            if (p.conn && p.conn.open) {
              p.conn.send({ type: 'hit' });
            }
          }
        });

        // パック同士の衝突判定
        for (let j = i + 1; j < pucks.length; j++) {
          const other = pucks[j];
          const dx = other.x - puck.x;
          const dy = other.y - puck.y;
          const dist = Math.hypot(dx, dy);
          const minDist = puck.radius + other.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) / 2;
            puck.x -= nx * overlap;
            puck.y -= ny * overlap;
            other.x += nx * overlap;
            other.y += ny * overlap;

            const kx = puck.vx - other.vx;
            const ky = puck.vy - other.vy;
            const pVal = 2 * (nx * kx + ny * ky) / 2;
            puck.vx -= pVal * nx;
            puck.vy -= pVal * ny;
            other.vx += pVal * nx;
            other.vy += pVal * ny;
          }
        }
      }

      playerList.forEach(p => { p.vx *= 0.2; p.vy *= 0.2; });
    }

    // 描画ループ
    function loop() {
      updatePhysics();

      ctx.fillStyle = 'rgba(10, 10, 15, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // ゴール時のフラッシュ背景
      if (goalFlash.timer > 0) {
        ctx.fillStyle = goalFlash.color;
        ctx.globalAlpha = (goalFlash.timer / 15) * 0.25;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
        goalFlash.timer--;
      }

      // 中央のサークル装飾
      ctx.beginPath();
      ctx.arc(arena.cx, arena.cy, arena.R * 0.22, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 生存プレイヤーのマップ
      const slotOwner = {};
      Object.values(players).filter(p => p.alive).forEach(p => { slotOwner[p.slot] = p; });

      // 正八角形の壁とゴールラインの描画
      for (let i = 0; i < 8; i++) {
        const edge = arena.edges[i];
        const owner = slotOwner[i];

        if (owner) {
          // ゴール開口部（プレイヤーカラーで点線＆発光）
          const g1x = edge.v1.x + edge.tx * (edge.len * 0.125);
          const g1y = edge.v1.y + edge.ty * (edge.len * 0.125);
          const g2x = edge.v1.x + edge.tx * (edge.len * 0.875);
          const g2y = edge.v1.y + edge.ty * (edge.len * 0.875);

          ctx.beginPath();
          ctx.moveTo(g1x, g1y);
          ctx.lineTo(g2x, g2y);
          ctx.strokeStyle = owner.color;
          ctx.lineWidth = 6;
          ctx.setLineDash([10, 8]);
          ctx.stroke();
          ctx.setLineDash([]);

          // 両端のポスト壁
          ctx.beginPath();
          ctx.moveTo(edge.v1.x, edge.v1.y);
          ctx.lineTo(g1x, g1y);
          ctx.moveTo(g2x, g2y);
          ctx.lineTo(edge.v2.x, edge.v2.y);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 6;
          ctx.stroke();

          // ゴール外側にプレイヤー番号と残りライフを表示
          const labelX = edge.mx - edge.nx * 24;
          const labelY = edge.my - edge.ny * 24;
          ctx.fillStyle = owner.color;
          ctx.font = 'bold 14px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`P${owner.num} (${owner.life})`, labelX, labelY);
        } else {
          // 空き辺・脱落辺は硬い壁として描画
          ctx.beginPath();
          ctx.moveTo(edge.v1.x, edge.v1.y);
          ctx.lineTo(edge.v2.x, edge.v2.y);
          ctx.strokeStyle = '#444';
          ctx.lineWidth = 6;
          ctx.stroke();
        }
      }

      // パックの描画
      pucks.forEach(puck => {
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
        ctx.fillStyle = puck.color;
        ctx.shadowBlur = 16;
        ctx.shadowColor = puck.color;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.radius * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      });

      // マレットの描画（生存プレイヤーのみ）
      Object.values(players).filter(p => p.alive).forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 14;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.num, p.x, p.y);
      });

      // 待機中・決着時のメッセージオーバーレイ
      if (gameState === 'waiting') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('参加者が揃ったら「ゲーム開始」を押してください', arena.cx, arena.cy);
      } else if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(arena.cx - 200, arena.cy - 45, 400, 90);
        ctx.fillStyle = '#FFCC00';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(winnerText, arena.cx, arena.cy);
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
