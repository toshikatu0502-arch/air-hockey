<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>エアホッケー コントローラー（横持ちレトロ風）</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1a1817; color: #fff; font-family: 'Courier New', sans-serif;
      touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
      overflow: hidden; position: fixed; inset: 0;
    }

    #gamepad-frame {
      width: 100%; height: 100%;
      box-sizing: border-box;
      border: 6px solid #d8d0c5;
      background: linear-gradient(180deg, #2b2625 0%, #1c1918 100%);
      display: flex; flex-direction: column;
      position: relative;
    }

    #top-bar {
      height: 36px;
      background: #8b1e24;
      border-bottom: 3px solid #d4af37;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px;
      z-index: 10;
    }
    #info {
      font-size: 16px; font-weight: bold; letter-spacing: 1px;
      text-shadow: 1px 1px 0 #000;
    }
    #fs-btn {
      padding: 4px 12px;
      background: #1c1918; color: #d8d0c5; border: 1px solid #d4af37;
      border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    #fs-btn:active { background: #3a3432; }

    canvas {
      flex: 1; width: 100%; height: 100%; display: block;
    }

    #rotate-notice {
      display: none;
      position: fixed; inset: 0; background: rgba(15, 15, 20, 0.95);
      z-index: 100; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px;
    }
    @media screen and (orientation: portrait) {
      #rotate-notice { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-notice">
    <div style="font-size: 40px; margin-bottom: 12px;">📱↻</div>
    <div style="font-size: 18px; font-weight: bold;">スマホを横向きにしてください</div>
    <div style="font-size: 13px; color: #aaa; margin-top: 6px;">左手で四角い枠内を操作・右手でボタン操作</div>
  </div>

  <div id="gamepad-frame">
    <div id="top-bar">
      <div id="info">CONNECTING...</div>
      <button id="fs-btn" onclick="enterFullscreen()">FULL SCREEN</button>
    </div>
    <canvas id="padCanvas"></canvas>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('host');
    const infoEl = document.getElementById('info');
    const fsBtn = document.getElementById('fs-btn');
    const canvas = document.getElementById('padCanvas');
    const ctx = canvas.getContext('2d');

    let playerColor = '#00ffcc';
    let hitFlash = 0;
    let dashFlash = 0;
    let conn = null;

    // 左側：ワイド四角形（□）操作パッドの座標範囲
    let padBox = { x: 24, y: 16, w: 200, h: 200 };
    let isPadTouching = false;
    let padTouchId = null;
    let cursorX = 0;
    let cursorY = 0;
    let lastX = null;
    let lastY = null;
    const trail = [];

    // 右側：ファミコン風 B / A ボタン（AボタンはDASH機能付き）
    let buttons = [
      { id: 'B', label: 'B', sub: '', x: 0, y: 0, r: 36, pressed: false, touchId: null },
      { id: 'A', label: 'A', sub: 'DASH', x: 0, y: 0, r: 38, pressed: false, touchId: null }
    ];

    // Aボタンのダッシュクールタイム表示用（ミリ秒）
    const DASH_COOLDOWN_MS = 1200;
    let lastDashTime = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      const w = canvas.width;
      const h = canvas.height;

      // 画面端の誤スワイプ防止用の余白を確保しつつ、左エリアいっぱいに四角形（□）を展開
      const edgeMarginX = Math.max(26, w * 0.035);
      const edgeMarginY = Math.max(16, h * 0.06);
      const rightZoneStart = w * 0.62; // 右38%をボタンエリア、左62%を操作エリアに割り当て

      padBox.x = edgeMarginX;
      padBox.y = edgeMarginY;
      padBox.w = Math.max(120, rightZoneStart - edgeMarginX - 12);
      padBox.h = Math.max(120, h - edgeMarginY * 2);

      if (!isPadTouching) {
        cursorX = padBox.x + padBox.w / 2;
        cursorY = padBox.y + padBox.h / 2;
      }

      // 右側：B・Aボタン配置
      const rightAreaW = w - rightZoneStart;
      const btnRadius = Math.min(rightAreaW * 0.19, h * 0.19);
      const rightCenterX = rightZoneStart + rightAreaW * 0.5;
      const rightCenterY = h * 0.52;
      const spacing = btnRadius * 2.45;

      // Bボタン（左下寄り）
      buttons[0].x = rightCenterX - spacing * 0.52;
      buttons[0].y = rightCenterY + btnRadius * 0.25;
      buttons[0].r = btnRadius;

      // Aボタン（右上寄り：DASH）
      buttons[1].x = rightCenterX + spacing * 0.52;
      buttons[1].y = rightCenterY - btnRadius * 0.25;
      buttons[1].r = btnRadius;
    }
    window.addEventListener('resize', resize);
    resize();

    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
      fsBtn.style.display = 'none';
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fsBtn.style.display = 'block';
      }
      setTimeout(resize, 100);
    });

    // 座標を四角形（padBox）の内側に制限する関数
    function clampToBox(x, y) {
      return {
        x: Math.max(padBox.x, Math.min(padBox.x + padBox.w, x)),
        y: Math.max(padBox.y, Math.min(padBox.y + padBox.h, y))
      };
    }

    function isInsideBox(x, y, margin = 8) {
      return (
        x >= padBox.x - margin &&
        x <= padBox.x + padBox.w + margin &&
        y >= padBox.y - margin &&
        y <= padBox.y + padBox.h + margin
      );
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const now = Date.now();
      const dashReadyRatio = Math.min(1, (now - lastDashTime) / DASH_COOLDOWN_MS);
      const isDashReady = dashReadyRatio >= 1;

      // --- 左側：ワイド四角形（□）操作パッド ---
      ctx.fillStyle = isPadTouching ? 'rgba(255, 255, 255, 0.07)' : '#141211';
      ctx.beginPath();
      ctx.roundRect(padBox.x, padBox.y, padBox.w, padBox.h, 12);
      ctx.fill();

      // 外枠のネオンフレーム（ダッシュ発動中は白く発光）
      ctx.lineWidth = (hitFlash > 0 || dashFlash > 0) ? 5 : 3;
      ctx.strokeStyle = dashFlash > 0 ? '#ffffff' : playerColor;
      ctx.shadowBlur = (hitFlash > 0 || dashFlash > 0) ? 20 : 6;
      ctx.shadowColor = dashFlash > 0 ? '#ffffff' : playerColor;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 内側のグリッド線（十字＋中心枠）
      const cx = padBox.x + padBox.w / 2;
      const cy = padBox.y + padBox.h / 2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(padBox.x + 12, cy);
      ctx.lineTo(padBox.x + padBox.w - 12, cy);
      ctx.moveTo(cx, padBox.y + 12);
      ctx.lineTo(cx, padBox.y + padBox.h - 12);
      ctx.stroke();

      // 指の軌跡（トレイル）
      if (trail.length > 1) {
        for (let i = 1; i < trail.length; i++) {
          ctx.beginPath();
          ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
          ctx.lineTo(trail[i].x, trail[i].y);
          ctx.strokeStyle = dashFlash > 0 ? '#ffffff' : playerColor;
          ctx.globalAlpha = (i / trail.length) * 0.55;
          ctx.lineWidth = (i / trail.length) * 14;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
      }

      // 操作カーソル（ノブ）
      if (isPadTouching) {
        ctx.beginPath();
        ctx.arc(cursorX, cursorY, 26, 0, Math.PI * 2);
        ctx.fillStyle = dashFlash > 0 ? '#ffffff' : playerColor;
        ctx.globalAlpha = 0.25;
        ctx.fill();
        ctx.globalAlpha = 1.0;

        ctx.beginPath();
        ctx.arc(cursorX, cursorY, 16, 0, Math.PI * 2);
        ctx.fillStyle = dashFlash > 0 ? '#ffffff' : playerColor;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cursorX, cursorY, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('TOUCH & SLIDE AREA', cx, cy);
      }

      // --- 右側：ファミコン風 B / A ボタン ---
      buttons.forEach(btn => {
        const plateSize = btn.r * 2.25;
        ctx.fillStyle = '#d8d0c5';
        ctx.beginPath();
        ctx.roundRect(btn.x - plateSize / 2, btn.y - plateSize / 2, plateSize, plateSize, 12);
        ctx.fill();

        const offsetY = btn.pressed ? 2 : -3;
        if (!btn.pressed) {
          ctx.beginPath();
          ctx.arc(btn.x, btn.y + 4, btn.r, 0, Math.PI * 2);
          ctx.fillStyle = '#4a0d10';
          ctx.fill();
        }

        // Aボタンはチャージ完了時に明るく発光
        let btnFill = btn.pressed ? '#ff3b30' : '#a81c24';
        if (btn.id === 'A' && !isDashReady) {
          btnFill = '#5a2a2d'; // クールタイム中は暗めの赤
        }

        ctx.beginPath();
        ctx.arc(btn.x, btn.y + offsetY, btn.r, 0, Math.PI * 2);
        ctx.fillStyle = btnFill;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#630e13';
        ctx.stroke();

        // Aボタンのチャージ進捗リング
        if (btn.id === 'A') {
          ctx.beginPath();
          ctx.arc(btn.x, btn.y + offsetY, btn.r - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * dashReadyRatio);
          ctx.strokeStyle = isDashReady ? '#FFCC00' : 'rgba(255, 255, 255, 0.35)';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        // 光沢ハイライト
        ctx.beginPath();
        ctx.arc(btn.x - btn.r * 0.25, btn.y + offsetY - btn.r * 0.25, btn.r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fill();

        // ボタン中央のサブ機能名（DASH）
        if (btn.sub) {
          ctx.fillStyle = isDashReady ? '#FFCC00' : 'rgba(255,255,255,0.45)';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(btn.sub, btn.x, btn.y + offsetY);
        }

        // プレート右下の「B」「A」刻印
        ctx.fillStyle = '#8b1e24';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText(btn.label, btn.x + plateSize / 2 - 6, btn.y + plateSize / 2 - 4);
      });

      if (hitFlash > 0) hitFlash--;
      if (dashFlash > 0) dashFlash--;
      if (!isPadTouching && trail.length > 0) trail.shift();

      requestAnimationFrame(draw);
    }
    draw();

    // PeerJS 通信処理
    if (!hostId) {
      infoEl.innerText = 'QR ERROR';
    } else {
      const peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(hostId);

        conn.on('open', () => {
          infoEl.innerText = 'READY!';
        });

        conn.on('data', (data) => {
          if (data.type === 'init') {
            playerColor = data.color;
            infoEl.style.color = data.color;
            infoEl.innerText = `PLAYER ${data.num}`;
          } else if (data.type === 'hit') {
            hitFlash = 8;
            if (navigator.vibrate) navigator.vibrate(30);
          } else if (data.type === 'goal') {
            if (navigator.vibrate) navigator.vibrate([100, 50, 150]);
          }
        });
      });
    }

    // マルチタッチ処理
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];

        // 1. 右側 B / A ボタン判定
        let hitButton = false;
        for (const btn of buttons) {
          if (btn.touchId === null && Math.hypot(touch.clientX - btn.x, touch.clientY - btn.y) <= btn.r + 14) {
            btn.pressed = true;
            btn.touchId = touch.identifier;
            hitButton = true;

            if (btn.id === 'A') {
              const now = Date.now();
              if (now - lastDashTime >= DASH_COOLDOWN_MS) {
                lastDashTime = now;
                dashFlash = 14;
                if (navigator.vibrate) navigator.vibrate(45);
                if (conn && conn.open) {
                  conn.send({ type: 'dash' });
                }
              }
            } else {
              if (navigator.vibrate) navigator.vibrate(15);
              if (conn && conn.open) {
                conn.send({ type: 'btn', button: btn.id, state: 'down' });
              }
            }
            break;
          }
        }
        if (hitButton) continue;

        // 2. 左側 四角形（□）パッド判定
        if (!isPadTouching && isInsideBox(touch.clientX, touch.clientY, 8)) {
          isPadTouching = true;
          padTouchId = touch.identifier;
          const clamped = clampToBox(touch.clientX, touch.clientY);
          cursorX = clamped.x;
          cursorY = clamped.y;
          lastX = clamped.x;
          lastY = clamped.y;
          trail.length = 0;
          trail.push({ x: cursorX, y: cursorY });
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (isPadTouching && touch.identifier === padTouchId) {
          const clamped = clampToBox(touch.clientX, touch.clientY);
          const dx = clamped.x - lastX;
          const dy = clamped.y - lastY;

          cursorX = clamped.x;
          cursorY = clamped.y;
          lastX = clamped.x;
          lastY = clamped.y;

          trail.push({ x: cursorX, y: cursorY });
          if (trail.length > 10) trail.shift();

          if ((dx !== 0 || dy !== 0) && conn && conn.open) {
            conn.send({ type: 'move', dx: dx, dy: dy });
          }
        }
      }
    }, { passive: false });

    const handleTouchEnd = (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (isPadTouching && touch.identifier === padTouchId) {
          isPadTouching = false;
          padTouchId = null;
          lastX = null;
          lastY = null;
        }
        for (const btn of buttons) {
          if (btn.touchId === touch.identifier) {
            btn.pressed = false;
            btn.touchId = null;
          }
        }
      }
    };
    canvas.addEventListener('touchend', handleTouchEnd);
    canvas.addEventListener('touchcancel', handleTouchEnd);
  </script>
</body>
</html>
