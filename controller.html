<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>エアホッケー コントローラー</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1a1a2e; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
      overflow: hidden; position: fixed; inset: 0;
    }
    #info { position: absolute; top: 24px; font-size: 22px; font-weight: bold; pointer-events: none; }
    #guide { color: rgba(255,255,255,0.6); pointer-events: none; text-align: center; line-height: 1.6; }
    #fs-btn {
      position: absolute; bottom: 30px; padding: 12px 24px;
      background: rgba(0, 0, 0, 0.5); color: #fff; border: 2px solid rgba(255,255,255,0.6);
      border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 20;
    }
    #fs-btn:active { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <div id="info">接続中...</div>
  <div id="guide">画面を指でなぞって操作<br><span style="font-size: 13px;">※画面の中央付近で動かすと誤操作を防げます</span></div>
  <button id="fs-btn" onclick="enterFullscreen()">全画面にして誤操作を防ぐ</button>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('host');
    const infoEl = document.getElementById('info');
    const fsBtn = document.getElementById('fs-btn');

    // 全画面表示への切り替え関数
    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
      fsBtn.style.display = 'none';
    }

    // 全画面が解除されたらボタンを再表示
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fsBtn.style.display = 'block';
      }
    });

    if (!hostId) {
      infoEl.innerText = 'エラー: QRコードから開いてください';
    } else {
      const peer = new Peer();

      peer.on('open', () => {
        const conn = peer.connect(hostId);

        conn.on('open', () => {
          infoEl.innerText = '接続完了！';
        });

        conn.on('data', (data) => {
          if (data.type === 'init') {
            document.body.style.background = data.color;
            infoEl.innerText = `あなたは Player ${data.num}`;
          } else if (data.type === 'hit') {
            if (navigator.vibrate) navigator.vibrate(30);
          }
        });

        let lastX = null;
        let lastY = null;

        // 画面端（左右25px以内）のタッチ開始をブロックして戻るジェスチャーを抑制
        window.addEventListener('touchstart', (e) => {
          const touch = e.touches[0];
          if (touch.clientX < 25 || touch.clientX > window.innerWidth - 25) {
            e.preventDefault();
          }
          lastX = touch.clientX;
          lastY = touch.clientY;
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
          e.preventDefault();
          if (lastX === null || !conn.open) return;
          const touch = e.touches[0];
          const dx = touch.clientX - lastX;
          const dy = touch.clientY - lastY;
          lastX = touch.clientX;
          lastY = touch.clientY;

          conn.send({ type: 'move', dx: dx, dy: dy });
        }, { passive: false });

        window.addEventListener('touchend', () => {
          lastX = null;
          lastY = null;
        });
      });
    }
  </script>
</body>
</html>
